name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  checks: read
  contents: read

jobs:
  Lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: "10.0.x"

      - name: Run
        uses: wearerequired/lint-action@v3
        with:
          dotnet_format: true
          prettier: true
